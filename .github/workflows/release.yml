name: Release

# Publishes a release tagged v<version> — the version read from
# src/resources.h (KHIPRO_PORTABLE_VERSION) — but only when that tag does
# not exist yet. Bumping the version is what cuts a release; a push whose
# v<version> already exists is skipped entirely.
#
# Triggers: push to main touching src/** or resources/khipro/**, or manual
# dispatch (also useful to retry a failed publish).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'resources/khipro/**'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.result.outputs.status }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64

      # ─── Version to release ───────────────────────────────────────

      - name: Read portable version (src/resources.h)
        id: version
        run: |
          version=$(grep -oP '(?<=#define KHIPRO_PORTABLE_VERSION ")[^"]+' src/resources.h)
          if [ -z "$version" ]; then
            echo "ERROR: KHIPRO_PORTABLE_VERSION not found in src/resources.h" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "target=v${version}" >> "$GITHUB_OUTPUT"

      # ─── Skip when this version is already released ───────────────

      - name: Check for existing release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          target="${{ steps.version.outputs.target }}"
          if gh api "repos/${{ github.repository }}/releases/tags/${target}" >/dev/null 2>&1; then
            echo "Release ${target} already exists — nothing to do. Bump the version to cut a new release."
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "Release ${target} does not exist yet — building."
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      # ─── Release context (vendored library, shipped versions) ─────

      - name: Read vendored library tag
        id: vendored
        if: steps.check.outputs.released == 'false'
        run: |
          tag=$(tr -d '[:space:]' < resources/khipro/.tag)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Read library prerelease flag
        id: lib
        if: steps.check.outputs.released == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prerelease=$(gh api "repos/KhiproTeam/khipro-library/releases/tags/${{ steps.vendored.outputs.tag }}" \
            --jq '.prerelease // false')
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      # Mandatory: every release post must show what ships in the exe.
      # A header without the macros (e.g. vendored from a repo checkout
      # instead of the release zip) aborts the release.
      - name: Read shipped versions from vendored header
        id: versions
        if: steps.check.outputs.released == 'false'
        run: |
          header="resources/khipro/include/khipro/khipro.h"
          lib=$(grep -oP '(?<=#define KHIPRO_LIBRARY_VERSION ")[^"]+' "$header") || true
          classic=$(grep -oP '(?<=#define KHIPRO_CLASSIC_VERSION ")[^"]+' "$header") || true
          dark=$(grep -oP '(?<=#define KHIPRO_DARK_VERSION ")[^"]+' "$header") || true
          if [ -z "$lib" ] || [ -z "$classic" ] || [ -z "$dark" ]; then
            echo "ERROR: vendored header lacks KHIPRO_LIBRARY_VERSION / KHIPRO_CLASSIC_VERSION / KHIPRO_DARK_VERSION." >&2
            echo "       Vendor from the release zip (make update-lib), not a repo checkout." >&2
            exit 1
          fi
          echo "lib=$lib"         >> "$GITHUB_OUTPUT"
          echo "classic=$classic" >> "$GITHUB_OUTPUT"
          echo "dark=$dark"       >> "$GITHUB_OUTPUT"

      # ─── Build ────────────────────────────────────────────────────

      - name: Build Windows executable
        id: build_exe
        if: steps.check.outputs.released == 'false'
        run: make

      - name: Verify executable
        if: steps.check.outputs.released == 'false'
        run: |
          if [ ! -s khipro.exe ]; then
            echo "ERROR: khipro.exe was not produced" >&2
            exit 1
          fi
          file khipro.exe

      # ─── Publish ──────────────────────────────────────────────────

      - name: Create release
        if: steps.check.outputs.released == 'false' && steps.build_exe.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          target="${{ steps.version.outputs.target }}"
          lib_tag="${{ steps.vendored.outputs.tag }}"
          lib_ver="${{ steps.versions.outputs.lib }}"
          classic_ver="${{ steps.versions.outputs.classic }}"
          dark_ver="${{ steps.versions.outputs.dark }}"

          flags=()
          if [ "${{ steps.lib.outputs.prerelease }}" = "true" ]; then
            flags+=(--prerelease)
          else
            flags+=(--latest)
          fi

          notes="Built against [khipro library ${lib_tag}](https://github.com/KhiproTeam/khipro-library/releases/tag/${lib_tag}).

          | Shipped in this exe | Version |
          | --- | --- |
          | Library | ${lib_ver} |
          | Classic layout | ${classic_ver} |
          | Dark layout | ${dark_ver} |"

          prev=$(gh api "repos/${{ github.repository }}/releases?per_page=1" --jq '.[0].tag_name // empty')
          if [ -n "$prev" ]; then
            notes="$notes

          **Full Changelog**: https://github.com/KhiproTeam/khipro-windows-portable/compare/${prev}...${target}"
          fi

          if [ "${{ steps.lib.outputs.prerelease }}" = "true" ]; then
            notes="$notes

          ⚠️ Built from a **pre-release** of the khipro library — this portable release is published as a beta and is **not** marked as latest."
          fi

          gh release create "$target" khipro.exe \
            "${flags[@]}" \
            --title "Khipro Windows Portable - $target" \
            --notes "$notes"

      # ─── Result ───────────────────────────────────────────────────

      - name: Set result
        id: result
        if: always()
        run: |
          if [ "${{ steps.build_exe.outcome }}" = "failure" ]; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.check.outputs.released }}" = "true" ]; then
            echo "status=already-released" >> "$GITHUB_OUTPUT"
          else
            echo "status=released" >> "$GITHUB_OUTPUT"
          fi
